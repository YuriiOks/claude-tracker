# Overlay for the production frontend: nginx serves the built dist/ and proxies
# /api + /ws to the backend service. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (or: make docker-prod)
#
# The backend service stays the same as in the base file.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: claude-tracker-frontend:prod
    environment: {}
    # `!override` replaces the base file's dev-server port entry instead of
    # appending to it -- otherwise :5173 and :80 are both published on host
    # :47820 and the stack fails to start. LAN_BIND mirrors the base file's
    # LAN gate (loopback-only unless set).
    ports: !override
      - "${LAN_BIND:-127.0.0.1}:47820:80"
    volumes: []
