# R-SEC-6: CSP as a `map` (constant lookup, not a real conditional) so the
# policy string is defined once. It still has to be re-declared via
# add_header inside /assets/ and = /index.html below -- nginx only inherits
# add_header from a parent block when the current block defines none of its
# own, and those two locations already set Cache-Control.
#
# script-src: the two inline <script> blocks in index.html (theme bootstrap +
# neural-bg canvas) are allowlisted by SHA-256 hash rather than
# 'unsafe-inline'. This is the whole point of using hashes here: a stored-XSS
# payload injected via some other hole (e.g. a malicious repo's tracked
# markdown, see MarkdownPanel) cannot execute as an inline <script> because
# its content won't match either hash. 'unsafe-inline' would have allowed it.
# Cost: if index.html's inline script bodies ever change, these hashes must
# be recomputed (macOS/Linux):
#   sed -n '<first-line-after-<script>>,<last-line-before-</script>>p' index.html \
#     | { printf '\n'; cat; printf '  '; } | openssl dgst -sha256 -binary | openssl base64 -A
# (the leading '\n' and trailing '  ' account for the newline right after
# `<script>` and the indentation right before `</script>` -- both are part
# of the hashed text per the CSP spec.)
#
# style-src: 'unsafe-inline' (not hashed) -- covers the one inline <style>
# block and two inline style="display:none" attributes in index.html.
# Hashing inline STYLE ATTRIBUTES (as opposed to <style> elements) needs the
# newer 'unsafe-hashes' CSP3 keyword, which has narrower browser support;
# for a single-user LAN dashboard, a CSS-only injection is far lower-value
# to an attacker than script execution, so 'unsafe-inline' here is an
# accepted trade-off (script-src stays strict either way).
map $host $csp_policy {
    default "default-src 'self'; script-src 'self' 'sha256-k43ThJoiLUBBtvH8owexDhktUmkhhjBcsFWjuaZCzC4=' 'sha256-uWIXlptW5EBu+urzcVKZQWHFCaQYP+MQyCkEGUYeh1g='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';";
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy $csp_policy always;

    # Gzip text responses. text/html is always compressed by nginx
    # regardless of gzip_types, so it doesn't need to be listed below.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # SPA fallback — every unknown path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets, no-cache for index.html
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp_policy always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp_policy always;
    }

    # Forward /api and /ws to the backend service when running in compose.
    # NOTE: this block is only used by the prod target. Dev target uses Vite proxy.
    location /api/ {
        proxy_pass         http://backend:8765;
        proxy_http_version 1.1;
        # $http_host (not $host) preserves the port the browser sent --
        # the backend's SecurityMiddleware compares Host against Origin
        # host:port, so dropping the port here would make every proxied
        # request look cross-origin.
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass         http://backend:8765;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $http_host;
        proxy_read_timeout 1d;
    }
}
