[project]
name = "claude-tracker-backend"
version = "0.1.0"
description = "Local FastAPI backend for Claude Tracker — reads ~/.claude/projects/**/*.jsonl and per-repo .claude/ folders"
readme = "README.md"
requires-python = ">=3.13,<3.14"

# Versions pinned to releases that are at least ~2 weeks old as of 2026-04-26.
# Bumping any pin? Re-run `uv lock` and `uv sync --extra dev`, then test.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "aiosqlite==0.20.0",
    "watchfiles==1.0.4",
    "httpx==0.28.1",
    "python-frontmatter==1.1.0",
    "pyyaml==6.0.2",
    "typer==0.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "respx==0.22.0",
    "ruff==0.8.6",
]

[project.scripts]
tracker = "app.cli:app_cli"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
